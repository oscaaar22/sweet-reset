# Despliegue en Render con un clic (Blueprint), todo en planes gratuitos.
# La base de datos es PostgreSQL gratuita de Neon (https://neon.tech): pega su URL en DATABASE_URL.
services:
  - type: web
    name: sweet-reset
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false       # URL de Neon (postgresql://...); Render te la pide al crear el servicio
      - key: PIN_TIENDA
        sync: false       # PIN para la página /tienda (canje de cupones en caja)
# Opcional, cuando tengan crédito en la API de Claude: agrega ANTHROPIC_API_KEY en
# Environment del servicio. Sin ella, la app usa su propio banco de retos y frases.
